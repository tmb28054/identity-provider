name: CI

# Pre-merge security and quality gate. Runs lint, type checks, security
# scanning (bandit + whole-tree secret scan + dependency audit + Trivy image
# scan for OS-package CVEs), and the unit test suite. Also runs on a daily
# schedule so advisories published between commits are caught. Gates run
# before any deployment. Remediation SLAs: see docs/security.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Scheduled scan so advisories published between commits are still caught
  # against the pinned dependencies and the base image (finding idp-20261003
  # F10). Runs daily at 03:17 UTC.
  schedule:
    - cron: "17 3 * * *"

# Least-privilege default token scope for every job in this workflow.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Ruff lint
        run: ruff check identity_provider_server

      - name: Mypy (strict)
        run: mypy identity_provider_server
        continue-on-error: true  # advisory until annotations are complete

      - name: Bandit (package + scripts, medium+)
        run: |
          bandit -r identity_provider_server -q --severity-level medium
          bandit -r scripts -q --severity-level medium

      - name: Dependency vulnerability audit
        run: pip-audit -c constraints.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2

      - name: Build image for scanning
        run: docker build -t idp-ci-scan:${{ github.sha }} .

      - name: Trivy image scan (OS packages + app deps)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: idp-ci-scan:${{ github.sha }}
          scan-type: image
          # Fail the build on fixable HIGH/CRITICAL findings so OS-level CVEs
          # in the base image do not accumulate silently.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Gitignored paths must not be tracked
        run: |
          # Fail if a .gitignore-listed path is actually tracked by git —
          # catches posture artifacts (e.g. scripts/deploy.py) committed
          # before the ignore rule, where the rule is a silent no-op.
          tracked="$(git ls-files -ci --exclude-standard)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked files match .gitignore; untrack them:"
            echo "$tracked"
            exit 1
          fi

      - name: Unit tests
        run: pytest -m "not integration" --ignore=tests/integration -q
