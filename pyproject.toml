[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-provider-server"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "signxml>=4.0,<5.0",
    "lxml>=5.0,<6.0",
    "bcrypt>=4.0,<6.0",
    "pyyaml>=6.0,<7.0",
    "cryptography>=42.0",
    "gunicorn>=22.0,<24.0",
    "pyotp>=2.9,<3.0",
    "qrcode>=8.0,<9.0",
    "pillow>=10.0",
    "requests>=2.31,<3.0",
    "webauthn>=3.0,<4.0",
]

[project.optional-dependencies]
adfs = [
    "ldap3>=2.9,<3.0",
]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "soft-webauthn>=0.1,<1.0",
]
integration = [
    "pytest>=9.1.1,<10.0",
    "playwright>=1.40",
    "pytest-playwright>=0.5",
    "pyotp>=2.9,<3.0",
    "soft-webauthn>=0.1,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: live subprocess smoke tests",
    "integration: end-to-end tests against live IdP (requires network)",
]

[tool.coverage.run]
source = ["identity_provider_server"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
    # Module-level script guards are only executed when run as a script.
    'if __name__ == .__main__.:',
]

[tool.setuptools.dynamic]
version = {attr = "identity_provider_server._version.__version__"}

[tool.setuptools.packages.find]
include = ["identity_provider_server*"]

[tool.setuptools.package-data]
identity_provider_server = ["static/*.js"]

[project.scripts]
identity-provider-server = "identity_provider_server.__main__:main"
run-idp = "identity_provider_server.run_gunicorn:main"
idp-hash-password = "identity_provider_server.hash_password:main"
get-jwt = "identity_provider_server.get_jwt:main"
verify-jwt = "identity_provider_server.verify_jwt:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

# These modules embed large HTML page templates as triple-quoted strings,
# whose lines legitimately exceed the code line-length limit. Exempt them
# from E501 (line-too-long) only; all other lint rules still apply.
[tool.ruff.lint.per-file-ignores]
"identity_provider_server/admin.py" = ["E501"]
"identity_provider_server/app.py" = ["E501"]
"identity_provider_server/totp.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
