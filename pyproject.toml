[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-provider-server"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4.0",
    "signxml>=4.0,<5.0",
    "lxml>=5.0,<6.0",
    "bcrypt>=4.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: live subprocess smoke tests"]

[tool.setuptools.dynamic]
version = {attr = "identity_provider_server._version.__version__"}

[tool.setuptools.packages.find]
include = ["identity_provider_server*"]

[project.scripts]
identity-provider-server = "identity_provider_server.__main__:main"
idp-hash-password = "identity_provider_server.hash_password:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
