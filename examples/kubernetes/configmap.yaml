apiVersion: v1
kind: ConfigMap
metadata:
  name: idp-config
  namespace: identity-provider
  labels:
    app.kubernetes.io/name: identity-provider-server
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 5000
      debug: false

    saml:
      provider_name: "my-corp-idp"
      session_duration_hours: 4

    data:
      users_file: "users.json"
      certificate_file: "idp.crt"
      private_key_file: "idp.key"

    logging:
      level: "INFO"

    security:
      # secret_key is provided via the Secret resource
      secret_key: ""
      rate_limit_max_attempts: 5
      rate_limit_window_seconds: 60

# NOTE: users.json contains bcrypt password hashes and TOTP secrets, so it is
# delivered via the Secret (see secret.yaml), NOT this ConfigMap. ConfigMaps are
# stored unencrypted in etcd and readable by anyone with namespace read access.
