apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-provider-server
  namespace: identity-provider
  labels:
    app.kubernetes.io/name: identity-provider-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-provider-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-provider-server
    spec:
      containers:
        - name: idp
          image: identity-provider-server:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: idp-secrets
                  key: SECRET_KEY
          volumeMounts:
            - name: config
              mountPath: /data/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /data/users.json
              subPath: users.json
              readOnly: true
            - name: certs
              mountPath: /data/idp.crt
              subPath: idp.crt
              readOnly: true
            - name: certs
              mountPath: /data/idp.key
              subPath: idp.key
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: idp-config
        - name: certs
          secret:
            secretName: idp-secrets
            items:
              - key: idp.crt
                path: idp.crt
              - key: idp.key
                path: idp.key
                mode: 0400
