apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-provider-server
  namespace: identity-provider
  labels:
    app.kubernetes.io/name: identity-provider-server
spec:
  # The rate limiter and single-use MFA/captcha/WebAuthn nonce stores are
  # per-process (in-memory). Running more than one replica without a shared
  # store multiplies the failed-login budget and lets a nonce be replayed once
  # per replica. Keep this at 1 unless a shared backend is introduced.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-provider-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-provider-server
    spec:
      containers:
        - name: idp
          image: identity-provider-server:latest
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: idp-secrets
                  key: SECRET_KEY
            # Safe to trust X-Forwarded-For/Proto here: an Ingress fronts the
            # pod and is the only client that reaches the container, so the
            # forwarded headers reflect the real client. This lets rate
            # limiting and the audit trail key on the true source IP.
            # Consumed by create_app('/data') (the image CMD), which reads IDP_*
            # itself and installs ProxyFix when this is true.
            - name: IDP_TRUST_PROXY
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /data/config.yaml
              subPath: config.yaml
              readOnly: true
            # users.json comes from the Secret (holds password hashes + TOTP
            # secrets), not the ConfigMap.
            - name: certs
              mountPath: /data/users.json
              subPath: users.json
              readOnly: true
            - name: certs
              mountPath: /data/idp.crt
              subPath: idp.crt
              readOnly: true
            - name: certs
              mountPath: /data/idp.key
              subPath: idp.key
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      automountServiceAccountToken: false
      volumes:
        - name: config
          configMap:
            name: idp-config
        - name: certs
          secret:
            secretName: idp-secrets
            defaultMode: 0400
            items:
              - key: idp.crt
                path: idp.crt
              - key: idp.key
                path: idp.key
                mode: 0400
              - key: users.json
                path: users.json
