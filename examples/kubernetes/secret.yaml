apiVersion: v1
kind: Secret
metadata:
  name: idp-secrets
  namespace: identity-provider
  labels:
    app.kubernetes.io/name: identity-provider-server
type: Opaque
stringData:
  # Flask secret key — the root HMAC key for every session and step-up token.
  # DO NOT commit a real value here and DO NOT ship a placeholder: the app
  # refuses to start on a known placeholder or a key shorter than 32 chars.
  # Create the Secret out of band instead of applying this literal. Generate a
  # key with: python3 -c "import secrets; print(secrets.token_hex(32))"
  # then: kubectl -n identity-provider create secret generic idp-secrets \
  #   --from-literal=SECRET_KEY=<generated> --from-file=idp.crt \
  #   --from-file=idp.key --from-file=users.json
  # The line below is intentionally left unset so `kubectl apply -k` cannot
  # deploy a known key; replace it only in an out-of-band copy.
  SECRET_KEY: ""

  # TLS certificate and private key for SAML assertion signing
  # Generate with:
  #   openssl req -x509 -newkey rsa:2048 -keyout idp.key -out idp.crt \
  #     -days 3650 -nodes -subj "/CN=my-corp-idp"
  idp.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_YOUR_CERTIFICATE
    -----END CERTIFICATE-----

  idp.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_YOUR_PRIVATE_KEY
    -----END PRIVATE KEY-----

  # User database — bcrypt password hashes and TOTP secrets. Kept in the Secret
  # (not a ConfigMap) because it is sensitive. Passwords MUST be bcrypt hashes
  # (generate with `idp-hash-password`); plaintext passwords are rejected.
  users.json: |
    [
      {
        "username": "admin",
        "password": "$2b$12$EXAMPLE_BCRYPT_HASH_HERE",
        "claims": ["idpadmin"],
        "roles": [
          {
            "account_id": "123456789012",
            "role": "AdminRole"
          }
        ]
      }
    ]
